<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Trading Analysis</title>

  </head>
  <body>
    <section id="chartSection">
        <div class="loading">
                <h1>Loading...<h1>
        </div>
        <div id="chart" class="bigChart"></div>
    </section>

    <section id="infoBar">
        <div id="primaryInputBar" class="inputBar">
            <input type="text" name="" value="" id="primaryTickerInput" class="inputElement" placeholder="Stock Ticker 1: SNDK">
            <input type="text" name="" value="" id="primaryRangeInput" class="inputElement" placeholder="Range: 1mo">
            <input type="text" name="" value="" id="primaryIntervalInput" class="inputElement" placeholder="Interval: 1d">
         </div>
    </section>

    <section class="extraInfo">
        <section id="pieChartSection">
            <div id="pieChart" class="box"></div>
        </section>

        <section>
            <div id="topChart" class="box"></div>
        </section>


        <section>
            <div id="portfolioOverTime" class="box"></div>
        </section>
    </section>


    <section class="extraInfo">
        <section id="pieChartSection">
            <div id="topWinnersToday" class="box"></div>
        </section>

        <section>
            <div id="topLosersToday" class="box"></div>
        </section>

        <section>
            <div id="topMoversToday" class="box"></div>
        </section>
    </section>


    <section class="extraInfo">
        <div id="compareLeft" class="box"></div>
        <div id="compareRight" class="box"></div>
    </section>

    <section id="infoBar">
        <!-- Add stock info for each under the search bar? -->
        <div id="cbar1" class="inputBar">
            <input type="text" name="" value="" id="compareInput1" class="inputElement" placeholder="Stock Ticker 1: SNDK">
            <input type="text" name="" value="" id="rangeInput1" class="inputElement" placeholder="Range: 1mo">
            <input type="text" name="" value="" id="intervalInput1" class="inputElement" placeholder="Interval: 1d">
         </div>
        <div id="cbar2" class="inputBar">
            <input type="text" name="" value="" id="compareInput2" class="inputElement" placeholder="Stock Ticker 2: ASML">
            <input type="text" name="" value="" id="rangeInput2" class="inputElement" placeholder="Range: 1mo">
            <input type="text" name="" value="" id="intervalInput2" class="inputElement" placeholder="Interval: 1d">
        </div>
    </section>

    <!-- <section id="chartSection"> -->
    <!--     <div id="holdingTimeAndReturn" class="bigChart"></div> -->
    <!-- </section> -->

    <section id="chartSection">
        <div id="profitOverTime" class="bigChart"></div>
    </section>

    <section id="chartSection">
        <div id="volatilityOverTime" class="bigChart"></div>
    </section>

    <section id="chartSection">
        <div id="riskReturnGraph" class="bigChart"></div>
    </section>

    <section id="chartSection">
        <div id="monteCarloGraph" class="bigChart"></div>
    </section>

    <section id="infoBar">
        <div id="monteCarloInputBar" class="inputBar">
            <input type="text" name="" value="" id="monteCarloTickerInput" class="inputElement" placeholder="Stock Ticker 1: SNDK">
            <input type="text" name="" value="" id="monteCarloHistoryInput" class="inputElement" placeholder="Available Dataset (days only): 100">
            <input type="text" name="" value="" id="monteCarloPeriodInput" class="inputElement" placeholder="Period Forward (days only): 100">
            <input type="text" name="" value="" id="monteCarloNSimulationsInput" class="inputElement" placeholder="Number of Simulations: 100">
         </div>
    </section>

    <section id="chartSection">
            <table id="stockTable">
                <tr>
                    <th>Name</th>
                    <th>Ticker</th>
                    <th>Today's P/L</th>
                    <th>Total P/L</th>
                    <th>Volatility</th>
                    <th>Portfolio %</th>
                </tr>

                <tr>
                    <td>Data</td>
                    <td>Data</td>
                    <td>Data</td>
                    <td>Data</td>
                    <td>Data</td>
                    <td>Data</td>
                    <td>Data</td>
                </tr>

            </table>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>

</html>
